[package]
name = "arrpc"
version = "4.0.0-rust"
edition = "2021"
license = "GPL-3.0"
description = "Open Discord RPC server for atypical setups, rewritten in Rust"
repository = "https://github.com/OpenAsar/arrpc"

[dependencies]
anyhow = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.24"
log = "0.4"
env_logger = "0.11"
